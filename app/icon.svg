<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 256 256"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Steam Galaxy</title>
  <desc id="description">一颗被金色轨道环绕的发光恒星</desc>
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="72%">
      <stop offset="0" stop-color="#102541" />
      <stop offset="1" stop-color="#050b16" />
    </radialGradient>
    <radialGradient id="star" cx="36%" cy="30%" r="70%">
      <stop offset="0" stop-color="#fff5c8" />
      <stop offset="0.3" stop-color="#ffd45f" />
      <stop offset="0.72" stop-color="#f3a928" />
      <stop offset="1" stop-color="#bf6615" />
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="256" height="256" rx="52" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="256" height="256" fill="url(#space)" />
    <g fill="#dceafe" opacity="0.58">
      <circle cx="42" cy="55" r="2" />
      <circle cx="202" cy="46" r="1.5" />
      <circle cx="221" cy="158" r="2" />
      <circle cx="49" cy="198" r="1.5" />
      <circle cx="177" cy="211" r="1.25" />
    </g>
    <ellipse
      cx="128"
      cy="128"
      rx="105"
      ry="51"
      fill="none"
      stroke="#ffd460"
      stroke-width="10"
      transform="rotate(-22 128 128)"
    />
    <ellipse
      cx="128"
      cy="128"
      rx="105"
      ry="51"
      fill="none"
      stroke="#fff3c2"
      stroke-opacity="0.6"
      stroke-width="2"
      transform="rotate(-22 128 128)"
    />
    <circle
      cx="128"
      cy="128"
      r="48"
      fill="#f2a629"
      fill-opacity="0.28"
      filter="url(#glow)"
    />
    <circle cx="128" cy="128" r="38" fill="url(#star)" />
    <circle
      cx="186"
      cy="96"
      r="10"
      fill="#5ac9c1"
      stroke="#b9fff3"
      stroke-width="3"
    />
  </g>
</svg>
